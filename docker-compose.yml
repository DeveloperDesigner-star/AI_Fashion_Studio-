# Local development stack: PostgreSQL + optional containerised API/web.
# The AI providers are intentionally not part of this stack — they are external
# free-tier HTTP APIs configured through environment variables.

services:
  db:
    image: postgres:16-alpine
    container_name: afs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: fashion
      POSTGRES_DB: fashion_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: afs-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://fashion:fashion@db:5432/fashion_studio
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in the environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      AI_PAID_USAGE_ENABLED: ${AI_PAID_USAGE_ENABLED:-false}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-gemini,groq,openai}
      AI_MAX_PROVIDER_ATTEMPTS: ${AI_MAX_PROVIDER_ATTEMPTS:-3}
      AI_PROVIDER_RETRIES: ${AI_PROVIDER_RETRIES:-0}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-45}
      TRYON_REMOTE_URL: ${TRYON_REMOTE_URL:-}
      TRYON_REMOTE_TOKEN: ${TRYON_REMOTE_TOKEN:-}
      MEDIA_ROOT: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    volumes:
      - media:/data/uploads

  tryon-worker:
    build:
      context: ./services/tryon-worker
    container_name: afs-tryon-worker
    restart: unless-stopped
    profiles: ["tryon"]
    environment:
      TRYON_WORKER_TOKEN: ${TRYON_WORKER_TOKEN:?set TRYON_WORKER_TOKEN for the try-on worker}
      CATVTON_VERSION: ${CATVTON_VERSION:-mix}
      CATVTON_PRECISION: ${CATVTON_PRECISION:-bf16}
      CATVTON_MODELS_DIR: ${CATVTON_MODELS_DIR:-}
    ports:
      - "8080:8080"
    # Compose (non-Swarm) needs this to pass the NVIDIA device through.
    gpus: all
    volumes:
      - tryon-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: afs-web
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
  media:
  tryon-models:
