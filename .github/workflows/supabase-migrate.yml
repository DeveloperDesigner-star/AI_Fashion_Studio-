name: Migrate Supabase

# Manual, phone-friendly migration job. Run it from GitHub → Actions after
# changing the schema. Add SUPABASE_DB_URL as a repository secret first; use the
# SESSION pooler or direct PostgreSQL URI (not the transaction pooler on 6543).
on:
  workflow_dispatch:
    inputs:
      seed_catalogue:
        description: "Seed/refresh the catalogue after migrating"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Alembic and seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      APP_ENV: staging
      SECRET_KEY: ci-migration-only-secret-key-which-is-long-enough-1234567890
      MEDIA_ROOT: /tmp/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Refuse to run without a database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add the SUPABASE_DB_URL repository secret first."
            exit 1
          fi
      - name: Apply Alembic migrations
        run: cd backend && python -m alembic upgrade head
      - name: Seed catalogue
        if: ${{ inputs.seed_catalogue }}
        run: cd backend && python scripts/init_db.py --skip-migrate
      - name: Create or update the admin account (optional)
        env:
          ADMIN_EMAIL: ${{ secrets.SUPABASE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SUPABASE_ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ vars.SUPABASE_ADMIN_NAME || 'Studio Admin' }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] && [ -z "$ADMIN_PASSWORD" ]; then
            echo "No admin secrets configured; skipping."
            exit 0
          fi
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Set both SUPABASE_ADMIN_EMAIL and SUPABASE_ADMIN_PASSWORD."
            exit 1
          fi
          cd backend
          python scripts/create_admin.py \
            --email "$ADMIN_EMAIL" \
            --password "$ADMIN_PASSWORD" \
            --name "$ADMIN_NAME"
