name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./var/ci.db
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: cd backend && python -m ruff check app tests
      - name: Pytest
        run: cd backend && python -m pytest -o addopts=""
      - name: Python dependency audit
        run: python -m pip_audit -r backend/requirements.txt

  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: ESLint and TypeScript
        run: cd frontend && npm run lint && npm run typecheck
      - name: Vitest
        run: cd frontend && npm run test -- --run
      - name: Production build
        run: cd frontend && npm run build
      - name: Runtime dependency audit
        run: cd frontend && npm audit --omit=dev

  e2e:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./var/e2e.db
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
      MEDIA_ROOT: ./var/uploads
      E2E_PORT: "5173"
      E2E_ADMIN_EMAIL: ci-admin@example.com
      E2E_ADMIN_PASSWORD: CiAdminPass123
      E2E_BROWSER_ARGS: --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist
      RATE_LIMIT_ENABLED: "true"
      # Browser journeys register several accounts from one runner IP. Keep the
      # limiter enabled but high enough that a legitimate test run is not 429'd.
      AUTH_RATE_LIMIT_PER_MINUTE: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          cd frontend && npm ci
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: |
          cd backend
          mkdir -p var/uploads
          python -m alembic upgrade head
          python scripts/init_db.py --skip-migrate
          python scripts/create_admin.py --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD" --name "CI Admin"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then break; fi
            if [ "$attempt" = "30" ]; then echo "API did not start"; cat /tmp/api.log; exit 1; fi
            sleep 1
          done
          cd ../frontend
          npx playwright test --workers=1
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log || true
